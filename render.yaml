services:
  - type: web
    name: nova-studio
    env: static
    buildCommand: ""
    staticPublishPath: .
  - type: web
    name: nova-tts
    env: node
    plan: free
    rootDir: tts-server
    buildCommand: npm install && python3 -m pip install --break-system-packages -r requirements.txt
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://nova-studio-qfco.onrender.com
